<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NSS Web App Redirect</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script checks if a redirect is present in the query string,
      // converts it back to a standard path and updates the browser history
      // state (without reloading the page).
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="text/javascript">
      // If the page is not found (which is always for direct deep links on GH Pages),
      // we redirect to index.html and pass the original path in the query string.
      // The script in index.html (or above) will then restore the path.
      var pathSegmentsToKeep = 0; // Set to 1 if using project pages like /repo-name/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to home...
  </body>
</html>
